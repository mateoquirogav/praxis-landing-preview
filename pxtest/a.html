<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Praxis | Diseño a medida para Tiendanube</title>
<meta name="description" content="Rediseño tu Tiendanube con código, a medida y editable. Mirá las tiendas en movimiento.">
<link rel="icon" href="favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800;900&family=Inter:wght@400;500;600&display=swap">
<style>
/* Noche navy + azul de la landing de ads; tipografía gigante; tiendas reales como video en celulares */
:root{
  --night:#050B18;
  --navy:#0C1A33;
  --card:#0E1B33;
  --line:rgba(150,190,240,.14);
  --blue:#2F86FF;
  --blue-2:#1F6FE5;
  --sky:#8FC0FF;
  --ice:#E3EEFF;
  --dim:#8193AE;
  --f-d:"Poppins",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-b:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--night);color:#fff;font-family:var(--f-b);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit;text-decoration:none}
img,video{max-width:100%;display:block}
h1,h2,h3{font-family:var(--f-d);margin:0;text-wrap:balance}
p{margin:0}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
:focus-visible{outline:2px solid var(--sky);outline-offset:4px;border-radius:8px}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.pill{display:inline-block;font-size:12px;font-weight:600;color:var(--sky);border:1px solid rgba(143,192,255,.35);background:rgba(47,134,255,.08);padding:7px 14px;border-radius:999px;font-family:var(--f-d);letter-spacing:.02em}
.hl{color:var(--sky)}

/* barra */
.top{position:fixed;inset:0 0 auto;z-index:40;padding-top:env(safe-area-inset-top,0px);transition:background .3s}
.top.solid{background:rgba(5,11,24,.82);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;justify-content:space-between;align-items:center;height:60px}
.brand{font-family:var(--f-d);font-weight:700;letter-spacing:.3em;font-size:13px}
.wa-round{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.07);border:1px solid var(--line);transition:background .25s}
.wa-round:hover{background:#1FA855}
.wa-round svg{width:19px;height:19px}

/* botón principal (el de la landing que ya convierte) */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;font-family:var(--f-d);font-weight:600;font-size:16px;color:#fff;background:var(--blue);padding:17px 28px;border-radius:999px;box-shadow:0 14px 40px -12px rgba(47,134,255,.8);transition:background .25s,box-shadow .25s}
.btn:hover{background:var(--blue-2);box-shadow:0 14px 50px -8px rgba(47,134,255,.95)}
.btn svg{width:19px;height:19px}
.btn-note{margin-top:12px;font-size:13px;color:var(--dim)}

/* HERO */
.hero{position:relative;padding-top:calc(118px + env(safe-area-inset-top,0px));overflow:hidden;isolation:isolate;text-align:center}
.glow{position:absolute;left:50%;top:62%;width:1150px;max-width:180vw;aspect-ratio:1;transform:translate(-50%,-50%);background:radial-gradient(closest-side,rgba(47,134,255,.42),rgba(47,134,255,.1) 55%,transparent);z-index:-1;pointer-events:none}
.hero h1{font-size:clamp(36px,7vw,84px);line-height:1.02;font-weight:800;letter-spacing:-.035em;margin:20px auto 0;max-width:15ch}
.hero h1 .hl{background:linear-gradient(90deg,#5DA2FF,#A8D0FF);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero .sub{margin:18px auto 0;color:var(--dim);font-size:17px;max-width:42ch}
.arc{position:relative;height:clamp(420px,52vw,640px);margin-top:44px;perspective:1400px;perspective-origin:50% 10%}
.arc-in{position:absolute;inset:0;transform-style:preserve-3d}
.ph{position:absolute;left:50%;top:0;--w:clamp(160px,18vw,250px);width:var(--w);margin-left:calc(var(--w)/-2);aspect-ratio:9/19.5;border-radius:34px;background:#01040B;padding:7px;box-shadow:0 50px 90px -30px rgba(0,0,0,.95),0 0 0 1px rgba(255,255,255,.1) inset}
.ph video,.ph img{width:100%;height:100%;object-fit:cover;object-position:top;border-radius:27px;background:#fff}
.ph[data-i="-2"]{transform:translateX(-152%) translateZ(-280px) rotateY(30deg)}
.ph[data-i="-1"]{transform:translateX(-80%) translateZ(-120px) rotateY(16deg)}
.ph[data-i="0"]{transform:translateZ(40px);z-index:3}
.ph[data-i="1"]{transform:translateX(80%) translateZ(-120px) rotateY(-16deg)}
.ph[data-i="2"]{transform:translateX(152%) translateZ(-280px) rotateY(-30deg)}
.ph[data-i="-1"],.ph[data-i="1"]{z-index:2}
.fade{position:absolute;inset:auto 0 0;height:45%;background:linear-gradient(transparent,var(--night));z-index:4;pointer-events:none}

/* SOY MATEO */
.me{padding-block:40px 90px}
.me-grid{display:grid;grid-template-columns:1fr 1fr;gap:56px;align-items:center}
.me h2{font-size:clamp(32px,5.2vw,58px);font-weight:800;letter-spacing:-.035em;line-height:1.02;margin-top:16px}
.me .txt{margin-top:18px;color:#C4D2E6;font-size:17px;max-width:44ch}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px}
.chip{font-size:13px;font-weight:500;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.03)}
.meet{margin-top:26px;display:grid;grid-template-columns:44px 1fr;gap:14px;padding:18px;border-radius:18px;background:linear-gradient(135deg,rgba(47,134,255,.16),rgba(47,134,255,.04));border:1px solid rgba(143,192,255,.22);max-width:480px}
.meet .ico{width:44px;height:44px;border-radius:12px;background:var(--blue);display:grid;place-items:center}
.meet .ico svg{width:22px;height:22px}
.meet b{font-family:var(--f-d);font-weight:600;font-size:16px}
.meet p{color:#B4C3D9;font-size:14px;margin-top:3px}

/* carrusel de mis videos */
.reels{position:relative;min-width:0}
.track{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;padding:6px 2px 10px;-webkit-overflow-scrolling:touch}
.track::-webkit-scrollbar{display:none}
.reel{flex:0 0 min(62%,250px);scroll-snap-align:center;position:relative;aspect-ratio:9/16;border-radius:22px;overflow:hidden;background:#000;border:1px solid var(--line)}
.reel video{width:100%;height:100%;object-fit:cover}
.reel .snd{position:absolute;right:10px;bottom:10px;width:36px;height:36px;border-radius:50%;background:rgba(0,0,0,.55);display:grid;place-items:center;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.reel .snd svg{width:17px;height:17px}
.reel .tap{position:absolute;left:10px;bottom:14px;font-size:12px;font-weight:600;background:rgba(0,0,0,.55);padding:5px 10px;border-radius:999px}
.reel.on .tap{display:none}
.arrows{display:flex;gap:10px;justify-content:flex-end;margin-top:8px}
.arr{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;transition:background .2s}
.arr:hover{background:rgba(255,255,255,.08)}
.arr svg{width:18px;height:18px}

/* PROBLEMAS */
.pains{padding-block:80px}
.pains h2,.moving h2{font-size:clamp(32px,5.4vw,60px);font-weight:800;letter-spacing:-.035em;line-height:1.02;text-align:center}
.pain-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:40px}
.pain{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;min-width:0}
.pain i{font-style:normal;font-family:var(--f-d);font-size:12px;color:var(--blue);font-weight:600}
.pain h3{font-size:18px;font-weight:700;margin-top:8px}
.pain p{color:var(--dim);font-size:14px;margin-top:6px}
.pain.key{background:linear-gradient(135deg,rgba(47,134,255,.22),rgba(47,134,255,.06));border-color:rgba(143,192,255,.3)}
.pain.key p{color:#C4D2E6}

/* DE TIENDAS A MARCAS — en movimiento */
.moving{padding-block:90px 60px;position:relative;overflow:hidden}
.moving .sub{text-align:center;color:var(--dim);margin:14px auto 0;max-width:40ch}
.wall{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;margin-top:50px;align-items:start}
.col{display:grid;gap:20px;will-change:transform}
.col:nth-child(even){margin-top:90px}
.site{display:block;text-align:left;width:100%}
.site .scr{aspect-ratio:9/19.5;border-radius:26px;background:#01040B;padding:6px;border:1px solid rgba(255,255,255,.1);box-shadow:0 30px 60px -30px rgba(0,0,0,.9);overflow:hidden}
.site video,.site img{width:100%;height:100%;object-fit:cover;object-position:top;border-radius:20px;background:#fff}
.site .nm{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-top:10px;padding-inline:4px}
.site b{font-family:var(--f-d);font-weight:600;font-size:15px}
.site span{font-size:12px;color:var(--dim);text-align:right}
.site:hover b{color:var(--sky)}

/* modal del loop */
.modal{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:calc(20px + env(safe-area-inset-top,0px)) 16px calc(20px + env(safe-area-inset-bottom,0px));opacity:0;pointer-events:none;transition:opacity .35s}
.modal.open{opacity:1;pointer-events:auto}
.m-bg{position:absolute;inset:0;background:var(--night)}
.m-bg img{position:absolute;inset:-10%;width:120%;height:120%;object-fit:cover;filter:blur(60px) saturate(1.3);opacity:.45;transform:scale(1.1)}
.m-bg::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 40%,rgba(5,11,24,.2),rgba(5,11,24,.85) 75%)}
.m-in{position:relative;display:grid;justify-items:center;gap:16px;transform:translateY(20px) scale(.97);transition:transform .45s cubic-bezier(.2,.8,.2,1)}
.modal.open .m-in{transform:none}
.m-ph{height:min(72svh,700px);aspect-ratio:9/19.5;border-radius:40px;background:#01040B;padding:8px;box-shadow:0 60px 120px -30px rgba(0,0,0,.9),0 0 0 1px rgba(255,255,255,.12) inset}
.m-ph video{width:100%;height:100%;object-fit:cover;object-position:top;border-radius:32px;background:#fff}
.m-meta{text-align:center}
.m-meta h3{font-size:22px;font-weight:700}
.m-meta p{color:#B4C3D9;font-size:14px}
.m-go{display:inline-flex;gap:8px;align-items:center;font-family:var(--f-d);font-weight:600;font-size:14px;padding:11px 18px;border-radius:999px;background:#fff;color:var(--night)}
.m-x{position:absolute;top:calc(16px + env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.1);display:grid;place-items:center;z-index:2}
.m-x svg,.m-nav svg{width:20px;height:20px}
.m-nav{position:absolute;top:50%;transform:translateY(-50%);width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.1);display:grid;place-items:center;z-index:2}
.m-prev{left:max(16px,env(safe-area-inset-left,0px))}.m-next{right:max(16px,env(safe-area-inset-right,0px))}

/* MI ORDEN */
.creed{padding-block:90px}
.lbl{font-family:var(--f-d);font-size:13px;letter-spacing:.3em;text-transform:uppercase;color:var(--dim);font-weight:500}
.words{margin-top:22px;display:grid}
.word{font-family:var(--f-d);font-weight:800;font-size:clamp(42px,10vw,128px);line-height:1;letter-spacing:-.045em;color:rgba(227,238,255,.12);transition:color .5s}
.word.lit{color:#fff}
.word.lit:first-child{color:var(--sky)}
.creed .end{margin-top:28px;font-family:var(--f-d);font-size:clamp(18px,2.4vw,24px);color:var(--dim);font-weight:500}
.creed .end b{color:#fff;font-weight:600}

/* CIERRE */
.final{position:relative;padding-block:120px 130px;text-align:center;overflow:hidden;isolation:isolate}
.final .glow{top:55%;width:950px}
.final h2{font-size:clamp(46px,10.5vw,140px);font-weight:900;letter-spacing:-.05em;line-height:.92;margin-top:18px}
.final h2 .out{color:transparent;-webkit-text-stroke:2px rgba(227,238,255,.85);letter-spacing:-.015em}
.final .sub{margin:24px auto 0;color:#C4D2E6;font-size:clamp(17px,2.2vw,20px);max-width:36ch}
.final .btn{margin-top:32px}
/* formulario que califica */
.quiz{max-width:560px;margin:40px auto 0;text-align:left;background:rgba(14,27,51,.85);border:1px solid rgba(143,192,255,.22);border-radius:24px;padding:24px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.q-top{display:flex;align-items:center;gap:14px;font-size:12px;color:var(--dim);font-family:var(--f-d);font-weight:500;white-space:nowrap}
.q-bar{flex:1;height:4px;border-radius:4px;background:rgba(255,255,255,.08);overflow:hidden}
.q-bar i{display:block;height:100%;width:33%;background:var(--blue);border-radius:4px;transition:width .4s ease}
.q{border:0;margin:0;padding:0;display:none;gap:10px;min-width:0}
.q.on{display:grid;animation:qin .35s ease both}
@keyframes qin{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:none}}
.q legend{font-family:var(--f-d);font-weight:700;font-size:clamp(21px,3.4vw,26px);line-height:1.2;padding:0;margin:22px 0 14px;letter-spacing:-.01em}
.q button[data-v]{text-align:left;font-size:16px;font-weight:500;padding:16px 18px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.03);transition:background .2s,border-color .2s}
@media (hover:hover){.q button[data-v]:hover{border-color:rgba(143,192,255,.5);background:rgba(47,134,255,.1)}}
.q button[data-v].sel{border-color:var(--blue);background:rgba(47,134,255,.2)}
.q label{font-size:13px;color:var(--dim);margin-top:4px}
.q input{font:inherit;font-size:16px;color:#fff;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:12px;padding:14px 16px;width:100%}
.q input:focus{outline:none;border-color:var(--blue)}
.q .btn{margin-top:10px;width:100%}
.q-err{color:#FF9B9B;font-size:13px}
.q-back{margin-top:14px;font-size:14px;color:var(--dim)}
.q-back:hover{color:#fff}
footer{border-top:1px solid var(--line);padding-block:26px calc(26px + env(safe-area-inset-bottom,0px));color:var(--dim);font-size:12px;letter-spacing:.06em}
footer .wrap{display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px}

/* botón fijo en celular */
.sticky{position:fixed;left:0;right:0;bottom:0;z-index:35;padding:14px max(16px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:linear-gradient(transparent,rgba(5,11,24,.96) 45%);display:none;transition:opacity .3s,transform .3s}
.sticky .btn{width:100%}
.sticky.hide{opacity:0;transform:translateY(100%);pointer-events:none}

@media (max-width:900px){
  .me-grid{grid-template-columns:1fr;gap:36px}
  .pain-grid{grid-template-columns:1fr 1fr}
  .wall{grid-template-columns:repeat(3,1fr)}
}
@media (max-width:640px){
  .hero{padding-top:calc(100px + env(safe-area-inset-top,0px))}
  .hero .sub{font-size:16px}
  .arc{height:410px;margin-top:34px}
  .ph{--w:170px;border-radius:28px;padding:6px}
  .ph video,.ph img{border-radius:22px}
  .ph[data-i="-2"],.ph[data-i="2"]{display:none}
  .ph[data-i="-1"]{transform:translateX(-70%) translateZ(-150px) rotateY(22deg)}
  .ph[data-i="1"]{transform:translateX(70%) translateZ(-150px) rotateY(-22deg)}
  .pain-grid{grid-template-columns:1fr;gap:10px}
  .pain{padding:18px}
  .wall{grid-template-columns:1fr 1fr;gap:14px}
  .col{gap:14px}
  .col:nth-child(even){margin-top:60px}
  .site .scr{border-radius:20px;padding:4px}
  .site video,.site img{border-radius:16px}
  .site .nm{flex-direction:column;gap:0}
  .site span{text-align:left}
  .m-nav{top:auto;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:none}
  .m-ph{height:min(64svh,620px)}
  .final h2 .out{-webkit-text-stroke:1.4px rgba(227,238,255,.85)}
  .sticky{display:block}
  footer{padding-bottom:110px}
}
@media (prefers-reduced-motion:reduce){.word,.modal,.m-in{transition:none}}
</style>
